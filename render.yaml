services:
  - type: web
    name: bizflow-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bizflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://YOUR_VERCEL_FRONTEND.vercel.app
      - key: APP_URL
        value: https://YOUR_VERCEL_FRONTEND.vercel.app

databases:
  - name: bizflow-db
    databaseName: bizflow
    user: bizflow
    plan: free
