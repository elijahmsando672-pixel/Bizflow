services:
  - type: web
    name: bizflow-api
    env: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: bizflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bizflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bizflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bizflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bizflow-db
          property: password
      - key: CORS_ORIGINS
        value: https://bizflow.vercel.app
      - key: APP_URL
        value: https://bizflow.vercel.app
      - key: BUSINESS_NAME
        value: BizFlow

databases:
  - name: bizflow-db
    databaseName: bizflow
    user: bizflow
    plan: free
